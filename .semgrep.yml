# Semgrep configuration for Kaleidosync desktop app.
# Extends the community "auto" ruleset but excludes generated/bundled files
# and trusted backend paths that produce false positives.
#
# CodeQL (separate job) still scans all source files including backends.

extends: auto

exclude:
  # Generated bundles — third-party code, not hand-written
  - "**/renderer.bundle.js"
  - "**/renderer.bundle.js.map"
  - "**/preload.bundle.cjs"
  - "**/preload.bundle.cjs.map"
  # Demo site (not part of the Electron app)
  - "**/index.html"
  # Build/release script — write target is a known, fixed path
  - "**/build-releases.js"
  # Audio backends: spawn() and join() calls here target trusted system
  # binaries and paths (ffmpeg, swiftc, PATH dirs, tmpdir). These are
  # intentional, not user-controlled. CodeQL still scans these files.
  - "**/audio/backends/*.js"
