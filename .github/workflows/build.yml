name: Build & Release Kaleidosync Desktop

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

env:
  NODE_VERSION: '20'
  ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
  # The smoke test drives the packaged Electron via Playwright's _electron, so
  # Playwright's own browser binaries are never needed — skip the ~300 MB download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    outputs:
      appimage-path: ${{ steps.build-appimage.outputs.path }}
      deb-path: ${{ steps.build-deb.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libasound2-dev pipewire libpipewire-0.3-dev

      - name: Install dependencies
        run: npm ci

      - name: Bundle renderer and preload
        run: npm run bundle

      - name: Verify sketch catalog
        run: |
          node -e "
            const data = require('./assets/sketches.json');
            console.log('Sketches:', data.count);
            console.log('Total variants:', data.sketches.reduce((s, sk) => s + sk.variants.length, 0));
            if (data.count !== 50) {
              console.error('ERROR: Expected 50 sketches, got', data.count);
              process.exit(1);
            }
            console.log('Catalog verification passed');
          "

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Rebuild renderer and preload bundles
        run: npm run build:bundles

      - name: Verify committed bundles are up to date
        run: git diff --exit-code -- app/renderer.bundle.js app/preload.bundle.cjs


      - name: Verify native audio helpers are present
        run: |
          test -s native/windows/kaleidosync-wasapi.exe
          test -s native/windows/smtc.ps1
          test -s native/macos/kaleidosync-sckit.swift

      - name: Build Linux AppImage
        id: build-appimage
        run: |
          npm run build -- --linux AppImage --publish never
          echo "path=$(ls dist/*.AppImage | head -1)" >> $GITHUB_OUTPUT

      - name: Build Linux deb
        id: build-deb
        run: |
          npm run build -- --linux deb --publish never
          echo "path=$(ls dist/*.deb | head -1)" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: kaleidosync-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      exe-path: ${{ steps.build-nsis.outputs.path }}
      portable-path: ${{ steps.build-portable.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bundle renderer and preload
        run: npm run bundle

      - name: Verify sketch catalog
        run: |
          node -e "
            const data = require('./assets/sketches.json');
            console.log('Sketches:', data.count);
            if (data.count !== 50) {
              console.error('ERROR: Expected 50 sketches, got', data.count);
              process.exit(1);
            }
            console.log('Catalog verification passed');
          "

      - name: Build Windows NSIS
        id: build-nsis
        run: |
          npm run build -- --win nsis --publish never
          echo "path=$(ls dist/*.exe | head -1)" >> $GITHUB_OUTPUT
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        continue-on-error: true

      - name: Build Windows Portable
        id: build-portable
        run: |
          npm run build -- --win portable --publish never
          echo "path=$(ls dist/*.zip | head -1)" >> $GITHUB_OUTPUT
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        continue-on-error: true

      - name: Run packaged-app smoke test
        run: npx playwright test
        env:
          ELECTRON_ENABLE_LOGGING: '1'

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ runner.os }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: kaleidosync-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30
        continue-on-error: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    outputs:
      dmg-path: ${{ steps.build-dmg.outputs.path }}
      zip-path: ${{ steps.build-zip.outputs.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile-check the ScreenCaptureKit helper
        run: |
          swiftc -typecheck \
            -target "$(uname -m)-apple-macos13" \
            -framework ScreenCaptureKit \
            -framework CoreMedia \
            -framework CoreGraphics \
            -framework AppKit \
            -framework AVFAudio \
            native/macos/kaleidosync-sckit.swift

      - name: Bundle renderer and preload
        run: npm run bundle

      - name: Verify sketch catalog
        run: |
          node -e "
            const data = require('./assets/sketches.json');
            console.log('Sketches:', data.count);
            if (data.count !== 50) {
              console.error('ERROR: Expected 50 sketches, got', data.count);
              process.exit(1);
            }
            console.log('Catalog verification passed');
          "

      - name: Build macOS DMG
        id: build-dmg
        run: |
          npm run build -- --mac dmg --publish never
          echo "path=$(ls dist/*.dmg | head -1)" >> $GITHUB_OUTPUT
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: true

      - name: Build macOS ZIP
        id: build-zip
        run: |
          npm run build -- --mac zip --publish never
          echo "path=$(ls dist/*.zip | head -1)" >> $GITHUB_OUTPUT
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          CSC_IDENTITY_AUTO_DISCOVERY: false
        continue-on-error: true

      - name: Run packaged-app smoke test
        run: npx playwright test
        env:
          ELECTRON_ENABLE_LOGGING: '1'

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ runner.os }}
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: kaleidosync-macos-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30
        continue-on-error: true

  verify-native:
    name: Verify native helpers build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-compile the Windows audio helper
        run: npm run build:native

      - name: Confirm the helper imports only system DLLs
        run: |
          x86_64-w64-mingw32-objdump -p native/windows/kaleidosync-wasapi.exe \
            | grep -i "DLL Name"
          # A stock Windows install must not need a redistributable.
          ! x86_64-w64-mingw32-objdump -p native/windows/kaleidosync-wasapi.exe \
            | grep -iE "libgcc|libwinpthread|libstdc"

  auto-release:
    name: Auto Release on Commit
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    needs: [build-linux, build-windows, build-macos, verify-native]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # actions/download-artifact@v4
        with:
          name: kaleidosync-linux-${{ github.sha }}
          path: dist/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # actions/download-artifact@v4
        with:
          name: kaleidosync-windows-${{ github.sha }}
          path: dist/windows
        continue-on-error: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # actions/download-artifact@v4
        with:
          name: kaleidosync-macos-${{ github.sha }}
          path: dist/macos
        continue-on-error: true

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-${{ steps.vars.outputs.short_sha }}
          name: Kaleidosync Desktop v2.0.0-${{ steps.vars.outputs.short_sha }}
          body: |
            ## Kaleidosync Desktop v2.0.0-${{ steps.vars.outputs.short_sha }}

            Automatic build from commit ${{ github.sha }}.

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Downloads
            - **Linux**: AppImage (x86_64), .deb (x86_64)
            - **Windows**: NSIS installer (.exe), Portable (.zip)
            - **macOS**: DMG (universal), ZIP (universal)

            ### System Audio Capture
            - Linux: PipeWire (`pw-record`) / PulseAudio (`parec`)
            - Windows: WASAPI loopback
            - macOS: ScreenCaptureKit / BlackHole

            ### Visualizers
            50 sketches, 92 variants from the original Kaleidosync reference.

          draft: false
          prerelease: false
          files: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/windows/*.exe
            dist/windows/*.zip
            dist/macos/*.dmg
            dist/macos/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

