name: CodeQL Scan & Auto Issues

# Static analysis for the Kaleidosync desktop app (JavaScript/TypeScript).
#
# - CodeQL (security-extended + security-and-quality) -> code scanning (Security tab)
# - Semgrep (--config auto)                            -> code scanning (Security tab)
# - Every SARIF finding is also mirrored into a GitHub Issue, one issue per
#   finding. Re-runs UPDATE the same issue (fingerprint match) instead of
#   opening duplicates, and issues whose finding is gone are auto-closed.
#
# Code scanning (the Security tab) is free on public repositories. On a private
# repository the CodeQL steps require GitHub Advanced Security; without it the
# analyze/upload steps fail, which is why they are the only steps that matter
# for the Security tab — the issue step below still works from the SARIF files.

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write
  actions: read

# Never run two scans at once: concurrent runs could race to open the same
# issue for the same fingerprint.
concurrency:
  group: codeql-auto-issues
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL + Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      # JavaScript/TypeScript is interpreted, so build-mode MUST be `none`.
      # (autobuild is only for compiled languages and would fail here.)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: results
          upload: true

      # Optional extra coverage. `--config auto` fetches the community ruleset
      # from semgrep.dev (needs network). Never fails the job.
      - name: Semgrep scan (extra coverage)
        if: always()
        run: |
          python -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan --config .semgrep.yml --sarif --output results/semgrep.sarif || true

      - name: Upload Semgrep SARIF to code scanning
        if: always() && hashFiles('results/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results/semgrep.sarif
          category: semgrep
          wait-for-processing: true

      # Mirror every finding in results/*.sarif into an upserted GitHub Issue.
      - name: Create or update GitHub issues from SARIF
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const LABEL = 'automated-scan';
            const MARKER = '<!-- kaleidosync-autoscan -->';
            const REPO = `${context.repo.owner}/${context.repo.repo}`;

            // ---- 1. Flatten every SARIF result into a finding ----------------
            const resultsDir = 'results';
            let files = [];
            try {
              files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.sarif'));
            } catch (e) {
              core.info(`No SARIF files in ${resultsDir}: ${e.message}`);
            }

            const sha = (s) => crypto.createHash('sha1').update(s).digest('hex').slice(0, 16);
            const findings = [];
            for (const file of files) {
              let sarif;
              try {
                sarif = JSON.parse(fs.readFileSync(`${resultsDir}/${file}`, 'utf8'));
              } catch (e) {
                core.warning(`Skipping unreadable SARIF ${file}: ${e.message}`);
                continue;
              }
              for (const run of sarif.runs || []) {
                const rules = {};
                for (const r of (run.tool && run.tool.driver && run.tool.driver.rules) || []) {
                  rules[r.id] = r;
                }
                for (const res of run.results || []) {
                  const ruleId = res.ruleId || 'unknown-rule';
                  const rule = rules[ruleId] || {};
                  const loc = (res.locations && res.locations[0] && res.locations[0].physicalLocation) || {};
                  const uri = (loc.artifactLocation && loc.artifactLocation.uri) || '(unknown file)';
                  const startLine = (loc.region && loc.region.startLine) || 0;
                  const msg = (res.message && res.message.text) || rule.shortDescription || ruleId;
                  const level = res.level || rule.defaultConfiguration || 'warning';
                  // CodeQL emits a stable per-finding hash; Semgrep may not, so
                  // fall back to a content hash. This is what prevents dupes.
                  const fp =
                    (res.partialFingerprints &&
                      (res.partialFingerprints.primaryLocationLineHash ||
                        Object.values(res.partialFingerprints)[0])) ||
                    sha(`${ruleId}|${uri}|${startLine}|${msg}`);
                  const helpUri = rule.helpUri || (res.rule && res.rule.helpUri) || '';
                  findings.push({ ruleId, uri, startLine, msg, level, fp, helpUri, file });
                }
              }
            }

            // De-dupe within this run by fingerprint.
            const byFp = new Map();
            for (const f of findings) if (!byFp.has(f.fp)) byFp.set(f.fp, f);
            core.info(`Scan produced ${byFp.size} unique finding(s) across ${files.length} SARIF file(s).`);

            // ---- 2. Load existing open auto-scan issues ----------------------
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: LABEL,
              state: 'open',
              per_page: 100
            });

            const markerRe = /<!--\s*kaleidosync-autoscan:fp=([0-9a-f]+)\s*-->/;
            const byFpIssue = new Map();
            for (const issue of open) {
              if (issue.pull_request) continue;
              const m = (issue.body || '').match(markerRe);
              if (m) byFpIssue.set(m[1], issue);
            }

            // ---- 3. Create or update -----------------------------------------
            let created = 0, updated = 0, closed = 0;
            const short = (u) => u.replace(/^.*?:\/\//, '');
            for (const [fp, f] of byFp) {
              const title = `[autoscan] ${f.ruleId} — ${short(f.uri)}:${f.startLine || '?'}`;
              const body = [
                MARKER,
                `<!-- kaleidosync-autoscan:fp=${fp} -->`,
                '',
                `**Rule:** \`${f.ruleId}\`  `,
                `**Severity:** ${f.level}  `,
                `**Location:** \`${f.uri}:${f.startLine || '?'}\`  `,
                f.helpUri ? `**Docs:** ${f.helpUri}  ` : '',
                '',
                '```',
                f.msg,
                '```',
                '',
                `_Source: \`${f.file}\` · updated ${new Date().toISOString()}_`
              ].join('\n');

              const existing = byFpIssue.get(fp);
              if (existing) {
                if ((existing.body || '') !== body) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    body
                  });
                  updated++;
                }
                byFpIssue.delete(fp);
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [LABEL]
                });
                created++;
              }
            }

            // ---- 4. Auto-close issues whose finding is gone -------------------
            for (const [, issue] of byFpIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              closed++;
            }

            core.summary
              .addHeading('Auto-scan issue sync')
              .addRaw(`Created **${created}**, updated **${updated}**, closed **${closed}**.`)
              .write();